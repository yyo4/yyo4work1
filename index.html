<head>
<meta charset="UTF-8">

<title>yyo4 — pixel art portfolio</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍥</text></svg>">
<meta property="og:title" content="yyo4 — pixel art portfolio">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light only">
<style>
  @font-face{
    font-family:"Donguri";
    src:url("x10y12pxDonguriDuel.ttf") format("truetype");
    font-display:swap;
  }
  :root{
    --ink:#3d3d3d;
    --soft:#9a9a9a;
    --faint:#c8c8c8;
    --line:#ececec;
    --accent:#a3d4f0;
  }
  *{box-sizing:border-box;}
  html{background:#fff;color-scheme:light only;}
  body{
    background:#fff;color:var(--ink);
    font-family:"Helvetica Neue","Microsoft JhengHei","微軟正黑體",sans-serif;
    font-size:10pt;line-height:1.9;letter-spacing:1.2px;
    max-width:900px;margin:0 auto;
    padding:70px 32px 110px;
    animation:fadeUp 1s ease-out both;
  }
  @keyframes fadeUp{
    from{opacity:0;transform:translateY(12px);}
    to{opacity:1;transform:translateY(0);}
  }

  header{text-align:center;margin-bottom:70px;}
  .name{
    font-family:"Donguri",monospace;
    font-size:26pt;letter-spacing:3px;
    color:var(--ink);margin:0 0 10px;
  }
  .role{
    font-family:"Donguri",monospace;
    font-size:11pt;color:var(--accent);
    letter-spacing:3px;margin:0;
  }


  .avatar{
    width:120px;height:120px;
    object-fit:cover;
    image-rendering:pixelated;
    border-radius:50%;
    border:1px solid var(--line);
    background:#fafafa;
    display:block;margin:0 auto 22px;
  }
  .contact{
    margin-top:16px;
    font-size:9.5pt;color:var(--soft);
    letter-spacing:1px;line-height:2;
  }
  .contact a{color:var(--accent);text-decoration:none;transition:opacity .5s ease;}
  .contact a:hover{opacity:.6;}
  .work figcaption{
    display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  }
  .work .year{
    font-family:"Donguri",monospace;
    color:var(--faint);font-size:8.5pt;flex:0 0 auto;
  }
  .intro{
    max-width:520px;margin:0 auto 70px;
    text-align:left;
    padding:24px 0;
    border-top:1px solid var(--line);
    border-bottom:1px solid var(--line);
    color:var(--ink);font-size:9.5pt;line-height:2.1;
    text-wrap:pretty;word-break:break-word;
  }
  .intro .h{
    font-family:"Donguri",monospace;
    color:var(--accent);font-size:11pt;
    letter-spacing:2px;margin-bottom:10px;
  }
  .intro{
    max-width:520px;margin:0 auto 70px;
    text-align:left;
    color:var(--ink);font-size:9.5pt;line-height:2.1;
    text-wrap:pretty;word-break:break-word;
    padding:22px 0;
    border-top:1px solid var(--line);
    border-bottom:1px solid var(--line);
  }
  .intro .label{
    font-family:"Donguri",monospace;
    color:var(--accent);font-size:10pt;
    letter-spacing:2px;display:block;margin-bottom:8px;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
    gap:28px;
  }
  .work{margin:0;}
  .work img{
    width:100%;height:auto;display:block;
    image-rendering:pixelated;
    border:1px solid var(--line);
    background:#fafafa;
    transition:opacity .6s ease,transform .6s ease;
  }
  .work img:hover{opacity:.85;transform:translateY(-3px);}
  .work figcaption{
    font-size:9pt;color:var(--soft);
    margin-top:8px;letter-spacing:1px;
    display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  }
  .cap-year{font-family:"Donguri",monospace;color:var(--faint);flex:0 0 auto;}
  .cap-title{text-wrap:pretty;}
  .foot .copy{display:inline-block;margin-top:10px;}

  .foot{
    text-align:center;margin-top:90px;
    font-family:"Donguri",monospace;
    color:var(--faint);font-size:9pt;letter-spacing:2px;
  }
  .foot a{color:var(--accent);text-decoration:none;transition:opacity .5s ease;}
  .foot a:hover{opacity:.6;}

  @media (max-width:600px){
    body{padding:50px 20px 80px;letter-spacing:0.6px;}
    .name{font-size:20pt;}
    .avatar{width:96px;height:96px;}
    .grid{grid-template-columns:1fr;gap:22px;}
  }
  @media (prefers-reduced-motion:reduce){
    body{animation:none;}
    .work img{transition:none;}
  }
</style>
