<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>manaa — pixel art portfolio</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍥</text></svg>">
<meta property="og:title" content="manaa — pixel art portfolio">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light only">
<style>
  @font-face{
    font-family:"Donguri";
    src:url("x10y12pxDonguriDuel.ttf") format("truetype");
    font-display:swap;
  }
  :root{
    --ink:#3d3d3d;
    --soft:#9a9a9a;
    --faint:#c8c8c8;
    --line:#ececec;
    --accent:#a3d4f0;
  }
  *{box-sizing:border-box;}
  html{background:#fff;color-scheme:light only;}
  body{
    background:#fff;color:var(--ink);
    font-family:"Helvetica Neue","Microsoft JhengHei","微軟正黑體",sans-serif;
    font-size:10pt;line-height:1.9;letter-spacing:1.2px;
    max-width:900px;margin:0 auto;
    padding:70px 32px 110px;
    animation:fadeUp 1s ease-out both;
  }
  @keyframes fadeUp{
    from{opacity:0;transform:translateY(12px);}
    to{opacity:1;transform:translateY(0);}
  }

  /* ===== 頭像與自介 ===== */
  .nav{
    font-family:"Donguri",monospace;
    font-size:10pt;letter-spacing:2px;
    text-align:center;margin-bottom:50px;
  }
  .nav a{
    color:var(--faint);text-decoration:none;margin:0 12px;
    transition:color .5s ease;
  }
  .nav a:hover{color:var(--accent);}
  .nav a.on{color:var(--accent);}
  header{text-align:center;margin-bottom:70px;}
  .avatar{
    width:120px;height:120px;
    object-fit:cover;
    image-rendering:pixelated;
    display:block;margin:0 auto 22px;
    border:1px solid var(--line);
  }
  .name{
    font-family:"Donguri",monospace;
    font-size:26pt;letter-spacing:3px;
    color:var(--ink);margin:0 0 8px;
  }
  .role{
    font-family:"Donguri",monospace;
    font-size:11pt;color:var(--accent);
    letter-spacing:3px;margin:0 0 26px;
  }
  .bio{
    max-width:520px;margin:0 auto;
    color:var(--soft);font-size:9.5pt;line-height:2;
    text-align:center;
    text-wrap:pretty;word-break:break-word;
  }

  /* ===== 作品格：整齊固定正方 ===== */
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
    gap:26px;
  }
  .work{margin:0;}
  .thumb{
    width:100%;aspect-ratio:1/1;
    overflow:hidden;
    border:1px solid var(--line);
    background:#fafafa;
    cursor:zoom-in;
  }
  .thumb img{
    width:100%;height:100%;
    object-fit:contain;      /* 完整顯示不裁切，尺寸不一也整齊 */
    display:block;
    image-rendering:pixelated;
    transition:opacity .6s ease,transform .6s ease;
  }
  .thumb:hover img{opacity:.85;transform:scale(1.03);}
  .work figcaption{
    font-size:9pt;color:var(--soft);
    margin-top:8px;letter-spacing:1px;
    display:flex;justify-content:space-between;gap:10px;
  }
  .work figcaption .year{color:var(--faint);flex:0 0 auto;}

  /* ===== Lightbox 點擊展開 ===== */
  .lightbox{
    position:fixed;inset:0;z-index:100;
    background:rgba(255,255,255,.96);
    display:none;
    align-items:center;justify-content:center;
    flex-direction:column;gap:16px;
    padding:40px 20px;
    cursor:zoom-out;
  }
  .lightbox.open{display:flex;}
  .lightbox img{
    max-width:92vw;max-height:78vh;
    image-rendering:pixelated;
    border:1px solid var(--line);
    background:#fff;
  }
  .lightbox .cap{
    color:var(--soft);font-size:9.5pt;letter-spacing:1px;
    text-align:center;
  }
  .lightbox .hint{
    font-family:"Donguri",monospace;
    color:var(--faint);font-size:8pt;letter-spacing:2px;
  }
  .lb-nav{
    position:fixed;top:50%;transform:translateY(-50%);
    font-family:"Donguri",monospace;font-size:22pt;
    color:var(--accent);cursor:pointer;user-select:none;
    padding:20px;z-index:101;
    transition:opacity .3s ease;
  }
  .lb-nav:hover{opacity:.5;}
  .lb-prev{left:6px;}
  .lb-next{right:6px;}
  @media (max-width:600px){
    .lb-nav{font-size:16pt;padding:14px;}
  }

  /* ===== 頁尾聯絡 ===== */
  .foot{
    text-align:center;margin-top:90px;
    font-family:"Donguri",monospace;
    color:var(--faint);font-size:9pt;letter-spacing:2px;
    line-height:2.4;
  }
  .foot a{color:var(--accent);text-decoration:none;transition:opacity .5s ease;}
  .foot a:hover{opacity:.6;}

  @media (max-width:600px){
    body{padding:50px 20px 80px;letter-spacing:0.6px;}
    .name{font-size:20pt;}
    .avatar{width:96px;height:96px;}
    .grid{grid-template-columns:repeat(2,1fr);gap:16px;}
  }
  @media (prefers-reduced-motion:reduce){
    body{animation:none;}
    .thumb img{transition:none;}
  }
</style>
</head>
<body>

  <div class="nav">
    <a href="index.html" class="on">- animation</a>
    <a href="still.html">- illustration</a>
  </div>

  <header>
    <img class="avatar" src="avatar.gif" alt="manaa">
    <p class="name">manaa</p>
    <p class="role">pixel art</p>
    <p class="bio">
      這裡寫簡單自我介紹。可以寫兩三行，例如創作方向、擅長的風格、經歷等等。
    </p>
  </header>

  <div class="grid" id="grid">
    <!-- 26 格由 script 自動生成：work1.gif ~ work26.gif -->
  </div>

  <p class="foot">
    <a href="https://x.com/fishhherr" target="_blank" rel="noopener">X @fishhherr</a><br>
    <a href="mailto:cindycindy931221@gmail.com">cindycindy931221@gmail.com</a><br>
    <a href="https://www.plurk.com/yyo4" target="_blank" rel="noopener">Plurk @yyo4</a><br>
    © 2026
  </p>

  <div class="lightbox" id="lightbox">
    <div class="lb-nav lb-prev" id="lb-prev">&lt;</div>
    <img id="lb-img" src="" alt="">
    <div class="cap" id="lb-cap"></div>
    <div class="hint">&lt; &gt; to browse / click to close</div>
    <div class="lb-nav lb-next" id="lb-next">&gt;</div>
  </div>

<script>
/* ====== 作品清單：說明與年份在這裡填 ======
   每行格式：["說明文字", "年份"]
   第 1 行對應 work1.gif、第 2 行對應 work2.gif …以此類推
   不想寫說明就留空字串 ""                         */
const works = [
  ["", ""],  // work1.gif
  ["", ""],  // work2.gif
  ["", ""],  // work3.gif
  ["", ""],  // work4.gif
  ["", ""],  // work5.gif
  ["", ""],  // work6.gif
  ["", ""],  // work7.gif
  ["", ""],  // work8.gif
  ["", ""],  // work9.gif
  ["", ""],  // work10.gif
  ["", ""],  // work11.gif
  ["", ""],  // work12.gif
  ["", ""],  // work13.gif
  ["", ""],  // work14.gif
  ["", ""],  // work15.gif
  ["", ""],  // work16.gif
  ["", ""],  // work17.gif
  ["", ""],  // work18.gif
  ["", ""],  // work19.gif
  ["", ""],  // work20.gif
  ["", ""],  // work21.gif
  ["", ""],  // work22.gif
  ["", ""],  // work23.gif
  ["", ""],  // work24.gif
  ["", ""],  // work25.gif
  ["", ""]   // work26.gif
];

const grid = document.getElementById('grid');
works.forEach((w, i) => {
  const n = i + 1;
  const fig = document.createElement('figure');
  fig.className = 'work';
  fig.innerHTML =
    '<div class="thumb"><img src="work' + n + '.gif" alt="work ' + n + '" loading="lazy"></div>' +
    '<figcaption><span>' + (w[0] || '') + '</span><span class="year">' + (w[1] || '') + '</span></figcaption>';
  fig.querySelector('.thumb').addEventListener('click', () => openLb(i));
  grid.appendChild(fig);
});

const lb = document.getElementById('lightbox');
const lbImg = document.getElementById('lb-img');
const lbCap = document.getElementById('lb-cap');
let cur = 0;
function showLb(i){
  cur = (i + works.length) % works.length;
  const w = works[cur];
  lbImg.src = 'work' + (cur+1) + '.gif';
  lbCap.textContent = [w[0], w[1]].filter(Boolean).join('　');
}
function openLb(i){
  showLb(i);
  lb.classList.add('open');
}
document.getElementById('lb-prev').addEventListener('click', e => { e.stopPropagation(); showLb(cur-1); });
document.getElementById('lb-next').addEventListener('click', e => { e.stopPropagation(); showLb(cur+1); });
lbImg.addEventListener('click', e => e.stopPropagation());
lb.addEventListener('click', () => lb.classList.remove('open'));
document.addEventListener('keydown', e => {
  if(!lb.classList.contains('open')) return;
  if(e.key === 'Escape') lb.classList.remove('open');
  if(e.key === 'ArrowLeft') showLb(cur-1);
  if(e.key === 'ArrowRight') showLb(cur+1);
});
</script>

</body>
</html>
